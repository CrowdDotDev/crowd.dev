display_information:
  name: LFX Onboarding
  description: Adds GitHub repositories to LFX Insights
  background_color: "#0f3b5a"
features:
  bot_user:
    display_name: LFX Onboarding
    always_online: true
  slash_commands:
    - command: /crowd
      url: https://cm.lfx.dev/api/slack/commands
      description: CDP operations (onboard-project, print-tenant, set-tenant-plan, help)
      usage_hint: onboard-project --repoUrl https://github.com/owner/repo
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.public
      - commands
settings:
  event_subscriptions:
    request_url: https://cm.lfx.dev/api/v1/slack/events
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://cm.lfx.dev/api/v1/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
